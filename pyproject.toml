[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magma-engine"
version = "0.1.0"
description = "GPU-accelerated Code Property Graph query engine for vulnerability detection"
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.11",
    "numpy>=1.25",
    "click>=8.0",
    "pyarrow>=14.0",
]

[project.scripts]
magma = "magma.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:load_cpg.*deprecated:DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["src"]
